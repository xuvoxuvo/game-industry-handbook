name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 首次运行会把仓库的 Pages 打开（Source = GitHub Actions），之后无需再手动设置。
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 站点是纯静态文件，没有构建步骤，只把要发布的文件挑出来。
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html 404.html favicon.svg _site/
          cp -r articles reports _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
