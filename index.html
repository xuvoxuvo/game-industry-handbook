<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>游戏行业知识手册</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="游戏行业里可以被引用的事实、口径与方法。">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f2ec;color:#252a2e;font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
a{color:#32677c;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:900px;margin:auto;padding:64px 35px 72px}
.head{padding-bottom:26px;border-bottom:3px solid #344954}
.eyebrow{font-size:12px;letter-spacing:3px;color:#65777f}
h1{margin:16px 0 12px;font-size:38px;line-height:1.35;letter-spacing:2px;font-weight:700;color:#252a2e}
.lede{margin:0;max-width:36em;color:#3f515b}
.list{margin:0;padding:0;list-style:none}
.item{display:grid;grid-template-columns:112px minmax(0,1fr);gap:26px;padding:24px 0;border-bottom:1px solid #dde2e0}
.item time{font-size:12.5px;line-height:2.1;color:#788087;white-space:nowrap;font-variant-numeric:tabular-nums}
.item h2{margin:0;font-size:21px;line-height:1.55;font-weight:700;color:#252a2e}
.item a:hover h2{color:#26716b}
.item p{margin:6px 0 0;max-width:44em;font-size:14px;line-height:1.85;color:#6a747b}
.item:last-child{border-bottom:0}
.foot{margin-top:56px;padding-top:20px;border-top:1px solid #c8d0cd;font-size:12.5px;line-height:1.95;color:#718079}
.foot p{margin:5px 0}
.foot a{color:#32677c;text-decoration:none;border-bottom:1px solid #c8d0cd}
.foot a:hover{color:#26716b;border-color:#26716b;text-decoration:none}
@media (max-width:640px){
  .wrap{padding:36px 20px 56px}
  h1{font-size:28px;letter-spacing:1px}
  .item{grid-template-columns:1fr;gap:4px;padding:18px 0}
  .item time{line-height:1.6}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="head">
    <div class="eyebrow">INDUSTRY NOTES</div>
    <h1>游戏行业知识手册</h1>
    <p class="lede">可以被引用的事实、口径与方法。</p>
  </header>

  <ul class="list">
    <li class="item">
      <time datetime="2026-11-07">2026/11/07</time>
      <div>
        <a href="articles/2026-mobile-game-metrics/"><h2>手游的留存与付费，到底该看多少</h2></a>
        <p>次留、七留、30 留、付费渗透率、ARPPU——五个指标的中位数、头部水平与倒推方法。</p>
      </div>
    </li>
  </ul>

  <footer class="foot">
    <p>喜欢本项目？<a href="https://github.com/xuvoxuvo/game-industry-handbook">点个 Star</a> 吧！</p>
    <p>Copyright © 2017-2026 设计者笔记. All rights reserved.</p>
  </footer>

</div>
</body>
</html>
